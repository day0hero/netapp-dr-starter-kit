---
global:
  pattern: netapp-dr-starter-kit
  options:
    useCSV: false
    syncPolicy: Automatic
    installPlanApproval: Automatic
tridentProtect:
  appVault:
    enabled: true
    name: s3-appvault
    s3:
      # Crossplane creates this bucket in AWS when it does not already exist (name must be globally unique).
      bucketName: xrd-appvault-protect
      region: us-west-1
  applications:
    - name: boutique
      namespaces:
        - name: boutique
    - name: wordpress
      namespaces:
        - name: wordpress
# Per-app DR routes (DNS targets follow AMR via hub dr-dns-reconciler when followPromotedDns is enabled).
drFailover:
  enabled: true
  domain: ""
  apps:
    - name: boutique
      routeName: frontend-dr
      namespace: boutique
      serviceName: frontend
      servicePort: http
    - name: wordpress
      routeName: wordpress-dr
      namespace: wordpress
      serviceName: wordpress
      servicePort: http
crossplane:
  providers:
    version: v2.4.0
  providerConfig:
    name: default
    credentials:
      secretName: aws-provider-creds
      secretNamespace: crossplane-system
      secretKey: credentials
      fromVault: true
main:
  clusterGroupName: hub
  multiSourceConfig:
    enabled: true
    clusterGroupChartVersion: "0.9.*"

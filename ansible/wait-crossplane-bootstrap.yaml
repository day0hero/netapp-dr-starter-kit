---
# Waits for in-cluster discovery and two OntapFileSystem CRs after `make install`.
# Does not fight Argo CD sync loops — discovery + PostSync on the chart queue the FSx sync.
#
# Usage:
#   make wait-crossplane-bootstrap PROD_KUBECONFIG=... DR_KUBECONFIG=...
#
- name: Wait for Crossplane discovery and dual FSx CRs
  hosts: localhost
  gather_facts: false
  vars:
    prod_kubeconfig: "{{ prod_kubeconfig | default(lookup('env', 'PROD_KUBECONFIG') | default('', true)) }}"
    dr_kubeconfig: "{{ dr_kubeconfig | default(lookup('env', 'DR_KUBECONFIG') | default('', true)) }}"
    pattern_name: netapp-dr-starter-kit
    cluster_group: hub
    hub_argo_namespace: "{{ pattern_name }}-hub"
    parent_argo_namespace: vp-gitops
    parent_application_name: "{{ pattern_name }}-{{ cluster_group }}"
    discovery_namespace: crossplane-system
    discovery_cm: crossplane-network-discovery
    discovery_cronjob: crossplane-network-discovery
    dr_kubeconfig_secret: ocp-dr-cluster-kubeconfig
    # Literal defaults only — do not use wait_* | default() here (self-reference → recursive loop).
    # Override with: ansible-playbook ... -e wait_app_timeout=2400
    wait_app_timeout: 1200
    wait_discovery_timeout: 1200
    wait_fsx_timeout: 1800
    repo_root: "{{ playbook_dir }}/.."
  tasks:
    - name: Require production kubeconfig
      ansible.builtin.assert:
        that:
          - prod_kubeconfig | length > 0
          - prod_kubeconfig is file
        fail_msg: "Set prod_kubeconfig (or PROD_KUBECONFIG) to the hub cluster kubeconfig."

    - name: Require DR kubeconfig (must match values-secret ocp-dr-cluster-kubeconfig path)
      ansible.builtin.assert:
        that:
          - dr_kubeconfig | length > 0
          - dr_kubeconfig is file
        fail_msg: >-
          Set DR_KUBECONFIG and load the same path into ~/values-secret-{{ pattern_name }}.yaml
          (ocp-dr-cluster-kubeconfig) before make install.

    - name: Wait for crossplane-aws-infra Application
      ansible.builtin.command:
        cmd: >
          oc --kubeconfig={{ prod_kubeconfig | quote }}
          get application.argoproj.io crossplane-aws-infra
          -n {{ hub_argo_namespace }}
      register: _cp_app
      until: _cp_app.rc == 0
      retries: "{{ (wait_app_timeout | int) // 20 }}"
      delay: 20
      changed_when: false

    - name: Patch parent Pattern Application ignoreDifferences (keeps discovery B64 on child Apps)
      ansible.builtin.command:
        cmd: "{{ repo_root }}/scripts/patch_parent_argocd_ignore.py"
      environment:
        KUBECONFIG: "{{ prod_kubeconfig }}"
        GLOBAL_PATTERN: "{{ pattern_name }}"
        CLUSTER_GROUP_NAME: "{{ cluster_group }}"
        ARGOCD_PARENT_APPLICATION_NAMESPACE: "{{ parent_argo_namespace }}"
        ARGOCD_PARENT_APPLICATION_NAME: "{{ parent_application_name }}"
      changed_when: true

    - name: Wait for DR kubeconfig secret in cluster
      ansible.builtin.command:
        cmd: >
          oc --kubeconfig={{ prod_kubeconfig | quote }}
          get secret {{ dr_kubeconfig_secret }}
          -n {{ discovery_namespace }}
      register: _dr_secret
      until: _dr_secret.rc == 0
      retries: "{{ (wait_discovery_timeout | int) // 20 }}"
      delay: 20
      changed_when: false

    - name: Wait for discovery CronJob
      ansible.builtin.command:
        cmd: >
          oc --kubeconfig={{ prod_kubeconfig | quote }}
          get cronjob {{ discovery_cronjob }}
          -n {{ discovery_namespace }}
      register: _disc_cron
      until: _disc_cron.rc == 0
      retries: "{{ (wait_discovery_timeout | int) // 20 }}"
      delay: 20
      changed_when: false

    - name: Probe discovery ConfigMap
      ansible.builtin.command:
        cmd: >
          oc --kubeconfig={{ prod_kubeconfig | quote }}
          get configmap {{ discovery_cm }}
          -n {{ discovery_namespace }}
          -o jsonpath={.data.discovery\.json}
      register: _disc_probe
      failed_when: false
      changed_when: false

    - name: Discovery ConfigMap missing or empty (not complete)
      ansible.builtin.set_fact:
        discovery_cm_complete: false
      when: >
        _disc_probe.rc != 0 or
        (_disc_probe.stdout | default('', true) | trim | length) == 0

    - name: Parse discovery ConfigMap _discoveryComplete
      ansible.builtin.set_fact:
        discovery_cm_complete: "{{ (_disc_probe.stdout | from_json).get('_discoveryComplete', false) | bool }}"
      when: >
        _disc_probe.rc == 0 and
        (_disc_probe.stdout | default('', true) | trim | length) > 0

    - name: Run discovery Job if ConfigMap not complete yet
      when: not (discovery_cm_complete | default(false) | bool)
      block:
        - name: Set discovery install Job name
          ansible.builtin.set_fact:
            discovery_install_job: "crossplane-discovery-install-{{ lookup('pipe', 'date +%s') }}"

        - name: Create discovery Job from CronJob
          ansible.builtin.command:
            cmd: >
              oc --kubeconfig={{ prod_kubeconfig | quote }}
              create job {{ discovery_install_job }}
              --from=cronjob/{{ discovery_cronjob }}
              -n {{ discovery_namespace }}
          register: _disc_job
          failed_when: false
          changed_when: _disc_job.rc == 0

        - name: Wait for discovery Job
          ansible.builtin.command:
            cmd: >
              oc --kubeconfig={{ prod_kubeconfig | quote }}
              wait --for=condition=complete
              job/{{ discovery_install_job }}
              -n {{ discovery_namespace }}
              --timeout=900s
          when: _disc_job.rc == 0
          changed_when: false
          failed_when: false

    - name: Wait for discovery ConfigMap (_discoveryComplete)
      ansible.builtin.command:
        cmd: >
          oc --kubeconfig={{ prod_kubeconfig | quote }}
          get configmap {{ discovery_cm }}
          -n {{ discovery_namespace }}
          -o jsonpath={.data.discovery\.json}
      register: _disc_raw
      until: >
        _disc_raw.rc == 0 and
        (_disc_raw.stdout | default('', true) | trim | length) > 0 and
        (_disc_raw.stdout | from_json).get('_discoveryComplete', false)
      retries: "{{ (wait_discovery_timeout | int) // 30 }}"
      delay: 30
      changed_when: false

    - name: Set discovery adopt Job name
      ansible.builtin.set_fact:
        discovery_adopt_job: "crossplane-discovery-adopt-{{ lookup('pipe', 'date +%s') }}"

    - name: Re-run discovery Job (adopt pre-existing FSx security groups after SG CRs exist)
      ansible.builtin.command:
        cmd: >
          oc --kubeconfig={{ prod_kubeconfig | quote }}
          create job {{ discovery_adopt_job }}
          --from=cronjob/{{ discovery_cronjob }}
          -n {{ discovery_namespace }}
      register: _disc_adopt_job
      failed_when: false
      changed_when: _disc_adopt_job.rc == 0

    - name: Wait for adopt discovery Job
      ansible.builtin.command:
        cmd: >
          oc --kubeconfig={{ prod_kubeconfig | quote }}
          wait --for=condition=complete
          job/{{ discovery_adopt_job }}
          -n {{ discovery_namespace }}
          --timeout=900s
      when: _disc_adopt_job.rc == 0
      failed_when: false
      changed_when: false

    - name: Wait for two FSx security groups Ready
      ansible.builtin.shell: |
        exec oc --kubeconfig={{ prod_kubeconfig | quote }} get securitygroup.ec2.aws.upbound.io -o json | python3 -c "
        import json, sys
        items = json.load(sys.stdin).get('items', [])
        ready = 0
        for i in items:
          name = (i.get('metadata') or {}).get('name') or ''
          if not name.endswith('-sg'):
            continue
          for c in (i.get('status') or {}).get('conditions') or []:
            if c.get('type') == 'Ready' and c.get('status') == 'True':
              ready += 1
              break
        sys.exit(0 if ready >= 2 else 1)
        "
      register: _sg_ready
      until: _sg_ready.rc == 0
      retries: "{{ (wait_discovery_timeout | int) // 30 }}"
      delay: 30
      changed_when: false

    - name: Wait for netappDrDiscoveryJsonB64 on crossplane-aws-infra
      ansible.builtin.command:
        cmd: >
          oc --kubeconfig={{ prod_kubeconfig | quote }}
          get application.argoproj.io crossplane-aws-infra
          -n {{ hub_argo_namespace }}
          -o json
      register: _app_json
      until: >
        _app_json.rc == 0 and
        (
          (_app_json.stdout | from_json).get('spec', {}).get('source', {}).get('helm', {}).get('parameters', [])
          | selectattr('name', 'equalto', 'netappDrDiscoveryJsonB64')
          | map(attribute='value')
          | reject('equalto', '')
          | list
          | length
        ) > 0
      retries: "{{ (wait_discovery_timeout | int) // 20 }}"
      delay: 20
      changed_when: false

    - name: Wait for two OntapFileSystem CRs
      ansible.builtin.command:
        cmd: >
          oc --kubeconfig={{ prod_kubeconfig | quote }}
          get ontapfilesystems.fsx.aws.upbound.io -o json
      register: _fsx_json
      until: >
        _fsx_json.rc == 0 and
        (_fsx_json.stdout | from_json).get('items', []) | length >= 2
      retries: "{{ (wait_fsx_timeout | int) // 30 }}"
      delay: 30
      changed_when: false

    - name: Show FSx CRs
      ansible.builtin.command:
        cmd: >
          oc --kubeconfig={{ prod_kubeconfig | quote }}
          get ontapfilesystems.fsx.aws.upbound.io -o wide
      changed_when: false

    - name: Re-apply parent Application ignoreDifferences (survives discovery B64 on child Apps)
      ansible.builtin.command:
        cmd: "{{ repo_root }}/scripts/patch_parent_argocd_ignore.py"
      environment:
        KUBECONFIG: "{{ prod_kubeconfig }}"
        GLOBAL_PATTERN: "{{ pattern_name }}"
        CLUSTER_GROUP_NAME: "{{ cluster_group }}"
        ARGOCD_PARENT_APPLICATION_NAMESPACE: "{{ parent_argo_namespace }}"
        ARGOCD_PARENT_APPLICATION_NAME: "{{ parent_application_name }}"
      changed_when: true

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Discovery complete and {{ (_fsx_json.stdout | from_json).get('items', []) | length }} OntapFileSystem CR(s) exist."
          - "AWS FSx provisioning can take 15–30 minutes; Trident may stay Degraded until endpoints are ready."

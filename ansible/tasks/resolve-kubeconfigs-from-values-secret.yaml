---
# Resolve prod_kubeconfig / dr_kubeconfig from ~/values-secret-<pattern>.yaml when not passed via -e or env.
- name: Resolve prod kubeconfig from values-secret
  ansible.builtin.command:
    cmd: python3 {{ repo_root }}/scripts/resolve_kubeconfigs_from_values_secret.py prod
  environment:
    PATTERN_NAME: "{{ pattern_name }}"
    VALUES_SECRET: "{{ lookup('env', 'VALUES_SECRET') | default('', true) }}"
  register: _kube_prod_resolved
  changed_when: false
  when: prod_kubeconfig | default('') | length == 0
  failed_when: false

- name: Apply prod kubeconfig from values-secret
  ansible.builtin.set_fact:
    prod_kubeconfig: "{{ _kube_prod_resolved.stdout | trim }}"
  when:
    - prod_kubeconfig | default('') | length == 0
    - _kube_prod_resolved.rc == 0
    - _kube_prod_resolved.stdout | trim | length > 0

- name: Resolve DR kubeconfig from values-secret
  ansible.builtin.command:
    cmd: python3 {{ repo_root }}/scripts/resolve_kubeconfigs_from_values_secret.py dr
  environment:
    PATTERN_NAME: "{{ pattern_name }}"
    VALUES_SECRET: "{{ lookup('env', 'VALUES_SECRET') | default('', true) }}"
  register: _kube_dr_resolved
  changed_when: false
  when: dr_kubeconfig | default('') | length == 0
  failed_when: false

- name: Apply DR kubeconfig from values-secret
  ansible.builtin.set_fact:
    dr_kubeconfig: "{{ _kube_dr_resolved.stdout | trim }}"
  when:
    - dr_kubeconfig | default('') | length == 0
    - _kube_dr_resolved.rc == 0
    - _kube_dr_resolved.stdout | trim | length > 0

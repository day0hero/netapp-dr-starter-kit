{{- if .Values.s3AppVault.enabled }}
{{- $s3 := include "crossplane-aws-infra.mergedS3AppVault" . | fromJson }}
{{- $bucket := required "Set tridentProtect.appVault.s3.bucketName in values-global (S3 bucket name Crossplane will create if missing in AWS)" $s3.bucketName }}
{{- $region := required "Set tridentProtect.appVault.s3.region in values-global" $s3.region }}
---
apiVersion: s3.aws.upbound.io/v1beta2
kind: Bucket
metadata:
  name: {{ $bucket }}
  labels:
    {{- include "crossplane-aws-infra.labels" . | nindent 4 }}
spec:
  forProvider:
    region: {{ $region }}
    forceDestroy: true
    tags:
      Name: {{ $bucket }}
      {{- range $k, $v := $s3.tags }}
      {{ $k }}: {{ $v | quote }}
      {{- end }}
  {{- include "crossplane-aws-infra.providerConfigRef" . | nindent 2 }}

---
apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketVersioning
metadata:
  name: {{ $bucket }}-versioning
spec:
  forProvider:
    region: {{ $region }}
    bucketRef:
      name: {{ $bucket }}
    versioningConfiguration:
      - status: Enabled
  {{- include "crossplane-aws-infra.providerConfigRef" . | nindent 2 }}

---
apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketServerSideEncryptionConfiguration
metadata:
  name: {{ $bucket }}-sse
spec:
  forProvider:
    region: {{ $region }}
    bucketRef:
      name: {{ $bucket }}
    rule:
      - applyServerSideEncryptionByDefault:
          - sseAlgorithm: AES256
        bucketKeyEnabled: true
  {{- include "crossplane-aws-infra.providerConfigRef" . | nindent 2 }}

---
apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketPublicAccessBlock
metadata:
  name: {{ $bucket }}-public-access
spec:
  forProvider:
    region: {{ $region }}
    bucketRef:
      name: {{ $bucket }}
    blockPublicAcls: true
    blockPublicPolicy: true
    ignorePublicAcls: true
    restrictPublicBuckets: true
  {{- include "crossplane-aws-infra.providerConfigRef" . | nindent 2 }}
{{- end }}
